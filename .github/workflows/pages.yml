# Publica PyAprende en GitHub Pages.
#
# Genera la versión estática del sitio (sin PHP ni MySQL: el progreso se guarda en el
# navegador de cada persona) y la sube a GitHub Pages en cada push a la rama principal.
# Requisito único: en GitHub → Settings → Pages → "Build and deployment" → Source: "GitHub Actions".
name: Publicar en GitHub Pages

on:
  push:
    branches: ["main", "claude/python-learning-web-platform-vysy65"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generar el sitio estático
        run: |
          php --version
          php tools/build_static.php dist
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
